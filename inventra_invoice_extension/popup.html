<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Inventra Fatura Asistanı</title>
  <style>
    :root { color-scheme: dark; }
    body {
      width: 320px;
      margin: 0;
      padding: 14px;
      font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
      background: #14161c;
      color: #e8e9ed;
      font-size: 13px;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    .header h1 { font-size: 14px; margin: 0; }
    .header a {
      color: #9a9ea8;
      font-size: 12px;
      text-decoration: none;
      cursor: pointer;
    }
    .header a:hover { color: #e8e9ed; }
    p.muted { color: #9a9ea8; font-size: 12px; line-height: 1.5; }
    button {
      width: 100%;
      padding: 9px;
      border-radius: 6px;
      border: none;
      background: #4c6ef5;
      color: white;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 6px;
    }
    button.secondary { background: #2a2d36; }
    button.danger { background: #fa5252; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .row-status {
      display: flex;
      justify-content: space-between;
      gap: 6px;
      padding: 4px 0;
      border-bottom: 1px solid #23262e;
      font-size: 12px;
    }
    .row-status .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .ok { color: #40c057; }
    .fail { color: #fa5252; }
    .wait { color: #9a9ea8; }
    .summary { margin: 8px 0; font-size: 12px; color: #9a9ea8; }
    .confirm-box {
      background: rgba(76, 110, 245, 0.12);
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 10px;
      font-size: 12.5px;
      line-height: 1.5;
    }
    .btn-row { display: flex; gap: 6px; }
    .btn-row button { margin-bottom: 0; }
  </style>
</head>
<body>
  <div class="header">
    <h1>Inventra Fatura Asistanı</h1>
    <a id="settings-link">⚙ Ayarlar</a>
  </div>
  <div id="content">
    <p class="muted">Yükleniyor...</p>
  </div>
  <script src="popup.js"></script>
</body>
</html>
