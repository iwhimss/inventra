<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Inventra Fatura Asistanı</title>
  <style>
    :root { color-scheme: dark; }
    body {
      width: 320px;
      margin: 0;
      padding: 16px;
      font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
      background: #14161c;
      color: #e8e9ed;
    }
    h1 { font-size: 15px; margin: 0 0 12px; }
    label { display: block; font-size: 12px; color: #9a9ea8; margin-bottom: 4px; }
    input[type=text] {
      width: 100%;
      box-sizing: border-box;
      padding: 8px;
      border-radius: 6px;
      border: 1px solid #2a2d36;
      background: #1c1f27;
      color: #e8e9ed;
      font-size: 13px;
      margin-bottom: 10px;
    }
    button {
      width: 100%;
      padding: 9px;
      border-radius: 6px;
      border: none;
      background: #4c6ef5;
      color: white;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 8px;
    }
    button.secondary { background: transparent; border: 1px solid #2a2d36; color: #9a9ea8; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    #status {
      font-size: 12px;
      padding: 8px 10px;
      border-radius: 6px;
      margin-bottom: 12px;
    }
    #status.ok { background: rgba(64, 192, 87, 0.15); color: #40c057; }
    #status.pending { background: rgba(255, 193, 7, 0.15); color: #ffc107; }
    #status.none { background: rgba(255, 255, 255, 0.06); color: #9a9ea8; }
  </style>
</head>
<body>
  <h1>Inventra Fatura Asistanı</h1>
  <div id="status" class="none">Sunucuyla eşleştirilmedi.</div>
  <label for="serverUrl">Inventra Sunucu Adresi</label>
  <input type="text" id="serverUrl" placeholder="http://192.168.1.100:5000">
  <button id="pairBtn">Eşleştirme İste</button>
  <button id="resetBtn" class="secondary">Bağlantıyı Kaldır</button>
  <script src="options.js"></script>
</body>
</html>
